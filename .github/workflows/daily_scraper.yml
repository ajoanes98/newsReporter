name: Daily Market News Scraper
permissions:
  contents: write
  
on:
  schedule:
    # Runs everyday at 12:00 UTC (7:00 AM EST)
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      companies:
        description: >
          Optional company list override. One company per line, or comma-separated.
          Leave blank to use companies.json.
        required: false
        type: string

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Scraper Script
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        TO_EMAIL: ${{ secrets.TO_EMAIL }}
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        COMPANIES: ${{ github.event.inputs.companies }}
      run: python scraper.py
      
    - name: Commit results
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add output/latest.json
        git commit -m "Update output [skip ci]" || echo "No changes to commit"
        git push
