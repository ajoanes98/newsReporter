name: Weekly Port Outreach (Slack)

on:
  schedule:
    # Mondays at 13:00 UTC (8:00 AM EST / 9:00 AM EDT)
    - cron: '0 13 * * 1'
  workflow_dispatch:
    inputs:
      companies:
        description: >
          Optional company list override. One company per line, or comma-separated.
          Leave blank to use companies.json.
        required: false
        type: string
      top:
        description: Number of top-priority accounts to post to Slack.
        required: false
        default: '5'
        type: string

jobs:
  weekly-outreach:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Post weekly outreach to Slack
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        COMPANIES: ${{ github.event.inputs.companies }}
      run: python scraper.py --weekly-outreach --top ${{ github.event.inputs.top || '5' }}
