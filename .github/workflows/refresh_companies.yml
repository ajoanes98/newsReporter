name: Weekly companies.json refresh

on:
  schedule:
    # Mondays 11:00 UTC — two hours before the Weekly Port Outreach job (13:00 UTC)
    - cron: '0 11 * * 1'
  workflow_dispatch: {}   # also lets a Port workflow trigger it on demand

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests
      - name: Rebuild list from HubSpot
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_PRIVATE_APP_TOKEN }}
        run: python scripts/refresh_companies.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add companies.json
          git commit -m "Refresh companies.json from HubSpot [skip ci]" || echo "No changes"
          git push
